<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carter's Clutter</title>

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

        }

        body{

            font-family:Arial, Helvetica, sans-serif;

            background:#111;

            color:white;

        }

        .hero{

            height:100vh;

            background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),

            url("photos/hero.jpg");

            background-size:cover;

            background-position:center;

            display:flex;

            justify-content:center;

            align-items:center;

            text-align:center;

            padding:20px;

        }

        h1{

            font-size:4rem;

            margin-bottom:15px;

        }

        h2{

            font-weight:300;

            color:#ddd;

            margin-bottom:35px;

        }

        .button{

            display:inline-block;

            padding:14px 32px;

            border:2px solid white;

            border-radius:40px;

            color:white;

            text-decoration:none;

            transition:.3s;

        }

        .button:hover{

            background:white;

            color:black;

        }

        .content{

            max-width:900px;

            margin:auto;

            padding:70px 20px;

        }

        p{

            line-height:1.8;

            color:#ccc;

            font-size:1.1rem;

        }

        @media(max-width:700px){

            h1{

                font-size:2.5rem;

            }

            h2{

                font-size:1.2rem;

            }

        }

    </style>

</head>

<body>

<section class="hero">

<div>

<h1>Carter's Clutter</h1>

<h2>My Online Photo Journal</h2>

<a class="button" href="#about">Enter Journal</a>

</div>

</section>

<section class="content" id="about">

<h2>Welcome</h2>

<p>

Welcome to Carter's Clutter.

This isn't a business portfolio—it's simply my online photo journal.

It's where I keep the places I've explored, the landscapes I've photographed,

and the memories I don't want to forget.

</p>

</section>

</body>

</html>
